# Orbit Production Nginx Load Balancer & Reverse Proxy Configuration

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Backend Nodes with Sticky Sessions for Socket.IO
    upstream orbit_backend {
        ip_hash; # Sticky sessions based on client IP
        server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
        # Add additional backend instances here for horizontal scaling
    }

    # Upstream WebSocket Nodes
    upstream orbit_websocket {
        ip_hash; # Sticky sessions for WebSocket handshakes
        server 127.0.0.1:3003 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name api.orbit-quickcontent.com;

        # Redirect HTTP to HTTPS in production
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.orbit-quickcontent.com;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/api.orbit-quickcontent.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.orbit-quickcontent.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # REST API Endpoints
        location /api/ {
            proxy_pass http://orbit_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Socket.IO Realtime WebSocket Upgrade Endpoint
        location /socket.io/ {
            proxy_pass http://orbit_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Sticky session & 120s idle timeout
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Static Uploads (Reels, Proxy Videos)
        location /upload/ {
            proxy_pass http://orbit_backend;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
