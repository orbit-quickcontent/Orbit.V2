name: orbit_partner_app
description: "ORBIT Real-Time Nearby Partner Tracking and Dispatch App for Creators & Videographers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  socket_io_client: ^2.0.3+1
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  flutter_background_service: ^5.0.5
  google_maps_flutter: ^2.6.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
