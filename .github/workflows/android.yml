name: ORBIT Android Builds

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  partner:
    name: Partner Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Partner dependencies
        working-directory: apps/partner-app
        run: flutter pub get

      - name: Analyze Partner app
        working-directory: apps/partner-app
        run: flutter analyze --no-fatal-infos

      - name: Build Partner APK
        working-directory: apps/partner-app
        run: flutter build apk --debug

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-debug-apk
          path: apps/partner-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  client:
    name: Client Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Client dependencies
        working-directory: apps/client-app
        run: flutter pub get

      - name: Analyze Client app
        working-directory: apps/client-app
        run: flutter analyze --no-fatal-infos

      - name: Build Client APK
        working-directory: apps/client-app
        run: flutter build apk --debug

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-client-debug-apk
          path: apps/client-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
