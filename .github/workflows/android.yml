name: ORBIT Android Partner Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  partner:
    name: Partner Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Flutter toolchain
        run: flutter --version

      - name: Generate Android project scaffolding
        working-directory: apps/partner-app
        run: flutter create --project-name partner_app --platforms=android --org com.orbit .

      - name: Resolve Flutter dependencies
        working-directory: apps/partner-app
        run: flutter pub upgrade

      - name: Analyze Partner app
        working-directory: apps/partner-app
        run: flutter analyze

      - name: Build Partner APK
        working-directory: apps/partner-app
        run: flutter build apk --debug

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-debug-apk
          path: apps/partner-app/build/app/outputs/flutter-apk/app-debug.apk
