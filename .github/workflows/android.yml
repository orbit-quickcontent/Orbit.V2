name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  partner:
    name: Partner Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'

      - name: Repair Flutter Android project scaffolding
        working-directory: apps/partner-app
        run: flutter create --platforms=android --org com.orbit .

      - name: Install Flutter dependencies
        working-directory: apps/partner-app
        run: flutter pub get

      - name: Analyze Partner app
        working-directory: apps/partner-app
        run: flutter analyze

      - name: Build Partner APK
        working-directory: apps/partner-app
        run: flutter build apk --debug

      - name: Upload Partner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-debug-apk
          path: apps/partner-app/build/app/outputs/flutter-apk/app-debug.apk
