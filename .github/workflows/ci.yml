name: ORBIT Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbitsecret
          POSTGRES_DB: orbit_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend
        working-directory: backend
        run: npm install --legacy-peer-deps
      - name: Prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma validate
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
        run: npm run lint
      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
        run: npm test -- --runInBand

  admin:
    name: Admin dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/admin-dashboard
        run: npm install --legacy-peer-deps
      - working-directory: apps/admin-dashboard
        run: npm run build

  editor:
    name: Editor web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: editor-web-app
        run: npm install --legacy-peer-deps
      - working-directory: editor-web-app
        run: npm run build

  partner-flutter:
    name: Partner Flutter analyze and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
      - working-directory: apps/partner-app
        run: flutter pub get
      - working-directory: apps/partner-app
        run: flutter analyze
      - working-directory: apps/partner-app
        run: flutter build apk --debug
