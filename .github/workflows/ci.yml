name: ORBIT Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ── 1. Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbitsecret
          POSTGRES_DB: orbit_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install --legacy-peer-deps

      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma@6.19.3 validate

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma@6.19.3 generate

      - name: Push database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma@6.19.3 db push --skip-generate

      - name: Typecheck
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
        run: npm run lint

      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
          REDIS_URL: redis://localhost:6379
        run: npm test

  # ── 2. Admin Dashboard ────────────────────────────────────────────────────────
  admin:
    name: Admin dashboard — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/admin-dashboard
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: apps/admin-dashboard
        run: npm run build

  # ── 3. Editor Web App ─────────────────────────────────────────────────────────
  editor:
    name: Editor web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: editor-web-app
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: editor-web-app
        run: npm run build

  # ── 4. Partner Flutter App ────────────────────────────────────────────────────
  partner-flutter:
    name: Partner app — analyze & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: apps/partner-app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/partner-app
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: apps/partner-app
        run: flutter build apk --debug

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-partner-debug-apk
          path: apps/partner-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ── 5. Client Flutter App ─────────────────────────────────────────────────────
  client-flutter:
    name: Client app — analyze, tests & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: apps/client-app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/client-app
        run: flutter analyze --no-fatal-infos

      - name: Widget tests
        working-directory: apps/client-app
        run: flutter test

      - name: Build APK
        working-directory: apps/client-app
        run: flutter build apk --debug

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-client-debug-apk
          path: apps/client-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
