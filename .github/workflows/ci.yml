name: ORBIT Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbitsecret
          POSTGRES_DB: orbit_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend
        working-directory: backend
        run: npm install --legacy-peer-deps
      - name: Prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma@6.19.3 validate
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma@6.19.3 generate
      - name: Provision CI database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: npx prisma@6.19.3 db push --skip-generate
      - name: Typecheck
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
        run: npm run lint
      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
        run: npm test

  admin:
    name: Admin dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: apps/admin-dashboard
        run: npm install --legacy-peer-deps
      - working-directory: apps/admin-dashboard
        run: npm run build

  editor:
    name: Editor web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: editor-web-app
        run: npm install --legacy-peer-deps
      - working-directory: editor-web-app
        run: npm run build

  partner-flutter:
    name: Partner Flutter analyze and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify Flutter toolchain
        run: flutter --version
      - name: Repair Flutter Android project scaffolding
        working-directory: apps/partner-app
        run: |
          flutter create --project-name partner_app --platforms=android --org com.orbit .
          rm -f android/app/src/main/kotlin/com/orbit/partner_app/MainActivity.kt
      - name: Upgrade Flutter dependencies
        working-directory: apps/partner-app
        run: flutter pub upgrade
      - working-directory: apps/partner-app
        run: flutter analyze
      - working-directory: apps/partner-app
        run: flutter build apk --debug
