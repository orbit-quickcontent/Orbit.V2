name: ORBIT Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Verify Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Verify Dashboard Web App
        run: |
          cd orbit-marketplace/dashboard-web-app
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: Install & Verify Standalone Backend
        run: |
          cd orbit-marketplace/backend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: Verify Docker Compose Build Configuration
        run: |
          docker compose -f docker-compose.prod.yml config
