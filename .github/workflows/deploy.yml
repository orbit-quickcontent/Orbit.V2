name: ORBIT Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Verify Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            dashboard-web-app/package-lock.json
            backend/package-lock.json
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

      - name: Install & Verify Dashboard Web App
        run: |
          cd dashboard-web-app
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Install & Verify Standalone Backend
        run: |
          cd backend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx prisma generate || true
          npm run build


      - name: Verify Docker Compose Build Configuration
        run: |
          touch .env.production
          docker compose -f docker-compose.prod.yml config
