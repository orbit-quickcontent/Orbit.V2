name: ORBIT Production Deploy

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & verify all services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            dashboard-web-app/package-lock.json
            backend/package.json

      - name: Install & build Dashboard Web App
        working-directory: dashboard-web-app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install, typecheck & build Backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
        run: |
          npm install --legacy-peer-deps
          npx prisma@6.19.3 validate
          npx prisma@6.19.3 generate
          npm run lint
          npm run build

      - name: Validate Docker Compose production config
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: |
          touch .env.production
          docker compose -f docker-compose.prod.yml config
