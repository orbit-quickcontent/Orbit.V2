name: ORBIT Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Verify Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            dashboard-web-app/package-lock.json
            backend/package.json

      - name: Install & Verify Dashboard Web App
        run: |
          cd dashboard-web-app
          npm install --legacy-peer-deps
          npm run build

      - name: Install & Verify Standalone Backend
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
          JWT_SECRET: ci-only-orbit-jwt-secret-should-never-be-used-in-production
        run: |
          cd backend
          npm install --legacy-peer-deps
          npx prisma@6.19.3 validate
          npx prisma@6.19.3 generate
          npm run build

      - name: Verify Docker Compose Build Configuration
        env:
          DATABASE_URL: postgresql://orbit:orbitsecret@localhost:5432/orbit_db?schema=public
        run: |
          touch .env.production
          docker compose -f docker-compose.prod.yml config
