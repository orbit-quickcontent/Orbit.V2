name: ORBIT iOS Builds

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ios:
    name: iOS — compile check (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build iOS Client (simulator, no signing)
        working-directory: mobile/ios-client
        run: |
          xcodebuild \
            -project OrbitClient.xcodeproj \
            -scheme OrbitClient \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Partner (simulator, no signing)
        working-directory: mobile/ios-partner
        run: |
          xcodebuild \
            -project OrbitPartner.xcodeproj \
            -scheme OrbitPartner \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build
