version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbit_dispatch_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=orbit_super_secret_jwt_key_2026_production_ready
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=*
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    container_name: orbit_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  redis_data:
